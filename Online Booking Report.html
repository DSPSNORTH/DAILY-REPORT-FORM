  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("officeName").addEventListener("change", function () {
        const office = this.value;
        fetch(`https://script.google.com/macros/s/AKfycbx9KEoDpiS_kroFHxqc_uMZF4s-v4KJAVQbFwyPPc3bztCYY3922Amku8Las8T6DyWAxQ/exec?officeName=${encodeURIComponent(office)}`)
          .then(res => res.text())
          .then(rawDate => {
            const parsed = new Date(rawDate);
            const formatted = isNaN(parsed) ? rawDate : parsed.toDateString();
            document.getElementById("lastEntered").value = formatted;
          })
          .catch(() => {
            document.getElementById("lastEntered").value = "Fetch error";
          });
      });
    });
  </script>
